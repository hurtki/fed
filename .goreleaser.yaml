version: 2
project_name: fed
builds:
  - id: default
    main: ./cmd/agent/main.go
    binary: fed
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
archives:
  - format: binary
    name_template: "fed-{{ .Os }}-{{ .Arch }}{{ .ArtifactExt }}"
checksum:
  name_template: "checksums.txt"
release:
  github:
    owner: hurtki
    name: fed
